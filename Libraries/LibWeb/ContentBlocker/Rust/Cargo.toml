[package]
name = "libweb_content_blocker_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

# After changing dependencies, regenerate the Flatpak sources:
#   python3 Meta/CMake/flatpak/generate-cargo-sources.py
[dependencies]
ak = { path = "../../../../AK/Rust" }
# Pinned exactly: an embedder hands over engines that adblock-rust 0.13.3 serialized, and only that version reads
# them. Cargo takes one 0.13 release for the whole build, so the browser's own lists compile with it too.
adblock = "=0.13.3"
ladybird_allocator = { path = "../../../RustAllocator", optional = true }
rustc-demangle = "0.1"
serde_json = "1.0"

[features]
default = []
allocator = ["dep:ladybird_allocator"]

[build-dependencies]
cbindgen = "0.29"

[lints]
workspace = true
